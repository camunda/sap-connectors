name: rfc-reusable-deploy

on:
  workflow_call:
    inputs:
      connector_version: # fex: 8.5.7 - 8.5 for Camunda release, 7 for connector version
        required: true
        type: string
      cf_api_endpoint:
        required: true
        type: string
      cf_org:
        required: true
        type: string
      cf_space:
        required: true
        type: string
    outputs:
      cluster_uuid:
        description: 'The UUID of the created Camunda Cloud cluster'
        value: ${{ jobs.create-cluster.outputs.cluster-uuid }}
      deployment_name:
        description: 'The name of the deployment'
        value: ${{ jobs.create-cluster.outputs.deployment-name }}
      region_id:
        value: ${{ jobs.create-cluster.outputs.region-id }}
      base_domain:
        value: ${{ jobs.create-cluster.outputs.base-domain }}

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
        camunda_release: ${{ steps.extract_release.outputs.camunda_release }}
    steps:
      - name: extract release branch # first two digits of connector_version
        run: echo "camunda_release=$(echo ${{ inputs.connector_version }} | cut -d'.' -f1-2)" >> "$GITHUB_OUTPUT"
        id: extract_release

  create-cluster:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: extract-version
    outputs:
        cluster-uuid: ${{ steps.create_cluster.outputs.cluster-id }}
        region-id: ${{ steps.create_cluster.outputs.region-id }}
        base-domain: ${{ steps.create_cluster.outputs.base-domain }}
        deployment-name: ${{ steps.set_deployment_name.outputs.deployment-name }}
    steps:
      - name: Set deployment name
        id: set_deployment_name
        run: |
          # Create a unique deployment name using version, branch and run ID
          DEPLOYMENT_NAME="sap-rfc-connector-${{ inputs.connector_version }}-${{ github.ref_name }}-${{ github.run_id }}"
          # Sanitize the name to make it compatible with SAP BTP (replace invalid characters with hyphens)
          DEPLOYMENT_NAME=$(echo "$DEPLOYMENT_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/-$//' | cut -c1-50)
          echo "deployment-name=$DEPLOYMENT_NAME" >> "$GITHUB_OUTPUT"
          echo "Using deployment name: $DEPLOYMENT_NAME"
      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_ID;
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_SECRET;
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Create cluster
        id: create_cluster
        run: node scripts/manage_cluster.js
        env:
          CONSOLE_CLIENT_ID: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_ID }}
          CONSOLE_CLIENT_SECRET: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_SECRET }}
          CAMUNDA_DESIRED_GENERATION: ${{ needs.extract-version.outputs.camunda_release }}
          CLUSTER_NAME: ${{ steps.set_deployment_name.outputs.deployment-name }}

  deploy:
    needs: create-cluster
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: install cf cli
        run: |
          set -euo pipefail
          # apt-key was removed from ubuntu-latest runners; use a signed-by keyring instead
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli
          cf install-plugin multiapps -f

      # first, build the connector
      - uses: actions/checkout@v7

      - name: set up jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: build
        run: mvn package -DskipTests # as we've run the tests in the previous job

      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_ID;
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_SECRET;
            secret/data/products/connectors/ci/sap SAP_CLOUDFOUNDRY_EMAIL;
            secret/data/products/connectors/ci/sap SAP_CLOUDFOUNDRY_PASSWORD;

      # the client secret must not travel via job outputs or artifacts, so create the client here
      - name: Create client for the deployed connector
        id: create_client
        run: node scripts/manage_cluster.js -c "$CLUSTER_ID" "${{ github.job }}"
        env:
          CLUSTER_ID: ${{ needs.create-cluster.outputs.cluster-uuid }}
          BASE_HOSTNAME: ${{ needs.create-cluster.outputs.base-domain }}
          CONSOLE_CLIENT_ID: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_ID }}
          CONSOLE_CLIENT_SECRET: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_SECRET }}

      # the only place where the deployment descriptor contains sensitive information
      - name: deploy ${{inputs.connector_version}} to BTP
        env:
          CF_API: ${{ inputs.cf_api_endpoint }}
          CF_ORG: ${{ inputs.cf_org }}
          CF_SPACE: ${{ inputs.cf_space }}
          CF_USER: ${{ steps.vault-secrets.outputs.SAP_CLOUDFOUNDRY_EMAIL }}
          CF_PASSWORD: ${{ steps.vault-secrets.outputs.SAP_CLOUDFOUNDRY_PASSWORD }}
          APP_VERSION: ${{ inputs.connector_version }}
          REGION_ID: ${{ needs.create-cluster.outputs.region-id }}
          CLUSTER_ID: ${{ needs.create-cluster.outputs.cluster-uuid }}
          BASE_DOMAIN: ${{ needs.create-cluster.outputs.base-domain }}
          CLIENT_ID: ${{ steps.create_client.outputs.client-id }}
          CLIENT_SECRET: ${{ steps.create_client.outputs.client-secret }}
          DEPLOYMENT_NAME: ${{ needs.create-cluster.outputs.deployment-name }}
        run: |
          set -euo pipefail
          cd rfc-connector
          # remove the filled-in descriptor, whatever the deploy outcome
          trap 'rm -f mtad.yaml' EXIT
          cp mtad.yaml.example mtad.yaml
          ../scripts/replace_mtad_placeholders.js \
            mtad.yaml \
            "$APP_VERSION" \
            "$REGION_ID" \
            "$CLUSTER_ID" \
            "$BASE_DOMAIN" \
            "$CLIENT_ID" \
            "$CLIENT_SECRET" \
            "$DEPLOYMENT_NAME" \
            "$APP_VERSION"
          ls -al . target
          cf login -a "$CF_API" -u "$CF_USER" -p "$CF_PASSWORD" -o "$CF_ORG" -s "$CF_SPACE"
          cf deploy ./ -f

      - name: dump app + MTA logs on failure
        if: failure()
        env:
          APP: ${{ needs.create-cluster.outputs.deployment-name }}
        run: |
          set +e
          echo "=== cf target ==="
          cf target
          echo "=== cf apps ==="
          cf apps
          echo "=== cf app $APP ==="
          cf app "$APP"
          echo "=== cf events $APP ==="
          cf events "$APP"
          echo "=== cf logs $APP --recent ==="
          cf logs "$APP" --recent
          echo "=== cf mta-ops ==="
          cf mta-ops
          OP_ID=$(cf mta-ops | awk 'NR>1 && $2=="deploy" {print $1}' | tail -1)
          if [ -n "$OP_ID" ]; then
            echo "=== cf dmol -i $OP_ID ==="
            cf dmol -i "$OP_ID"
          fi
