name: rfc-build-and-publish

on:
 workflow_call:
   inputs:
     final_version:
       required: true
       type: string

jobs:
  unit-test:
    permissions:
      contents: read   # tests only need to read the repository
    uses: ./.github/workflows/rfc-reusable-unit-test.yml
    with:
      java-version: '25'
      distribution: 'temurin'
      maven-options: '-PcheckFormat'


  build-and-gh_release:
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by ncipollo/release-action to publish the GitHub release
      id-token: write   # required for OIDC auth against Google Artifact Registry

    steps:
      - uses: actions/checkout@v7

      - name: set up jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Set connector version
        run: |
          mvn versions:set -DnewVersion=${{ inputs.final_version }} -DgenerateBackupPoms=false
      - name: build project
        run: mvn clean package -DskipTests

      - name: create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "rfc-connector/target/*.war,rfc-connector/element-templates/*.json,rfc-connector/mtad.yaml.example"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "rfc-${{ inputs.final_version }}"
          name: "RFC ${{ inputs.final_version }}"
          body: "RFC Release ${{ inputs.final_version }}"
          commit: ${{github.ref}}
          allowUpdates: 'true'
          removeArtifacts: 'true'

      # The steps below build and push a minimal `scratch` image containing only the
      # just-released RFC connector WAR, for internal CVE scanning of the sap-connectors
      # repo. This is NOT a supported RFC runtime distribution - see rfc-connector/Dockerfile.scanner.
      - name: Stage RFC scanner image context
        run: |
          set -euo pipefail
          RFC_WAR=$(find rfc-connector/target -maxdepth 1 -name 'rfc-*.war' -print -quit)
          if [ -z "$RFC_WAR" ]; then
            echo "ERROR: No WAR file found in rfc-connector/target/" >&2
            exit 1
          fi
          mkdir -p /tmp/rfc-scanner-context
          cp "$RFC_WAR" /tmp/rfc-scanner-context/sap-rfc-connector.war
          cp rfc-connector/Dockerfile.scanner /tmp/rfc-scanner-context/Dockerfile

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to InfoSec Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: sap-rfc-connector - build and push scanner image tag ${{ inputs.final_version }}
        uses: docker/build-push-action@v7
        with:
          context: /tmp/rfc-scanner-context
          push: true
          tags: |
            europe-west1-docker.pkg.dev/team-infosec/camunda/sap-rfc-connector:${{ inputs.final_version }}
          platforms: linux/amd64
          provenance: false
