name: e2e-tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ "release/*", "main" ]
  push:
    branches: [ "release/*", "main", "sap-connectors-e2e-test-refactoring" ]

jobs:
  determine-connector-version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.scope_version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v7

      - name: set up jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: extract release version
        id: extract_version
        # this extracts <version> from pom.xml into env.VERSION
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_ENV"

      - name: scope the version into an output
        id: scope_version
        run: echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  extract-version:
    runs-on: ubuntu-latest
    needs: determine-connector-version
    outputs:
        camunda_release: ${{ steps.extract_release.outputs.camunda_release }}
    steps:
      - name: extract release branch # first two digits of connector_version
        env:
          VERSION: ${{ needs.determine-connector-version.outputs.VERSION }}
        run: echo "camunda_release=$(echo "$VERSION" | cut -d'.' -f1-2)" >> "$GITHUB_OUTPUT"
        id: extract_release

  create-cluster:
    runs-on: ubuntu-latest
    needs: [extract-version,determine-connector-version]
    outputs:
        cluster-uuid: ${{ steps.create_cluster.outputs.cluster-id }}
        deployment-name: ${{ steps.set_deployment_name.outputs.deployment-name }}
    steps:
      - name: Set deployment name
        id: set_deployment_name
        env:
          VERSION: ${{ needs.determine-connector-version.outputs.VERSION }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Unique deployment name; run ID comes first so truncation never removes it
          DEPLOYMENT_NAME="sap-odata-${RUN_ID}-${VERSION}-${REF_NAME}"
          # Sanitize the name to make it compatible with SAP BTP (replace invalid characters with hyphens), then truncate
          DEPLOYMENT_NAME=$(echo "$DEPLOYMENT_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | cut -c1-50 | sed 's/-$//')
          echo "deployment-name=$DEPLOYMENT_NAME" >> "$GITHUB_OUTPUT"
          echo "Using deployment name: $DEPLOYMENT_NAME"
      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID}}
          secrets: |
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_ID;
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_SECRET;
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Create cluster
        id: create_cluster
        run: node scripts/manage_cluster.js values.json
        env:
          CONSOLE_CLIENT_ID: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_ID }}
          CONSOLE_CLIENT_SECRET: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_SECRET }}
          CAMUNDA_DESIRED_GENERATION: ${{ needs.extract-version.outputs.camunda_release }}
          CLUSTER_NAME: ${{ steps.set_deployment_name.outputs.deployment-name }}
      - name: Upload client config for e2e test
        uses: actions/upload-artifact@v7
        with:
          name: client-config
          path: values.json
          retention-days: 1

      # Static 8.10.3 used until alternative container image storage configured for development "$VERSION" testing
      - name: fill in ODATA target cluster credentials
        env:
          VERSION: ${{ needs.determine-connector-version.outputs.VERSION }}
          REGION_ID: ${{ steps.create_cluster.outputs.region-id }}
          CLUSTER_ID: ${{ steps.create_cluster.outputs.cluster-id }}
          CLIENT_ID: ${{ steps.create_cluster.outputs.client-id }}
          CLIENT_SECRET: ${{ steps.create_cluster.outputs.client-secret }}
          DEPLOYMENT_NAME: ${{ steps.set_deployment_name.outputs.deployment-name }}
          IMAGE_TAG: "SNAPSHOT"
        run: |
          scripts/replace_mtad_placeholders.js \
          odata-connector/mtad.yaml.example \
          "8.10.3" \
          "$REGION_ID" \
          "$CLUSTER_ID" \
          "ultrawombat.com" \
          "$CLIENT_ID" \
          "$CLIENT_SECRET" \
          "$DEPLOYMENT_NAME" \
          "$IMAGE_TAG"
          mv odata-connector/mtad.yaml.example mtad.yaml

      # no worries: gh marks secrets with *** also when cat'ing files
      - name: check ODATA substitution result
        run: |
          cat mtad.yaml

      - name: Upload ODATA mtad.yaml
        uses: actions/upload-artifact@v7
        with:
          name: odata-mtad
          path: mtad.yaml
          retention-days: 1

#  rfc-e2e:
#    needs: determine-connector-version
#    uses: ./.github/workflows/rfc-reusable-deploy.yml
#    with:
#      connector_version: ${{ needs.determine-connector-version.outputs.VERSION }}
#      cf_api_endpoint: 'https://api.cf.eu10-004.hana.ondemand.com'
#      cf_org: camunda-dev
#      cf_space: sap-integration
#    secrets: inherit

  odata-e2e:
    needs: [ determine-connector-version, create-cluster ]
    uses: ./.github/workflows/odata-e2e-test.yml
    with:
      connector_version: ${{ needs.determine-connector-version.outputs.VERSION }}
      deployment_name: ${{ needs.create-cluster.outputs.deployment-name }}
      cf_api_endpoint: 'https://api.cf.eu10-004.hana.ondemand.com'
      cf_org: camunda-dev
      cf_space: sap-integration
    secrets: inherit

  delete-cluster:
    runs-on: ubuntu-latest
    needs: [ create-cluster, odata-e2e ]
    if: always() && needs.create-cluster.outputs.cluster-uuid != ''
    steps:
      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID}}
          secrets: |
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_ID;
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_SECRET;
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Delete cluster
        run: node scripts/manage_cluster.js -d "$CLUSTER_UUID"
        env:
          CLUSTER_UUID: ${{ needs.create-cluster.outputs.cluster-uuid }}
          CONSOLE_CLIENT_ID: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_ID }}
          CONSOLE_CLIENT_SECRET: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_SECRET }}
