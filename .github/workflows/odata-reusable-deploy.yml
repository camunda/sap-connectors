name: odata-reusable-deploy

on:
  workflow_call:
    inputs:
      connector_version: # fex: 8.5.7 - 8.5 for Camunda release, 7 for connector version
        required: true
        type: string
      deployment_name:
        required: true
        type: string
      cf_api_endpoint:
        required: true
        type: string
      cf_org:
        required: true
        type: string
      cf_space:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: cloudfoundry/cli:latest

    steps:
      # first, build the connector
      - uses: actions/checkout@v7

      # second, prep deployment descriptor
      - name: download ODATA mtad.yaml
        uses: actions/download-artifact@v8
        with:
          name: odata-mtad
          path: odata-connector/

      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID}}
          secrets: |
            secret/data/products/connectors/ci/sap SAP_CLOUDFOUNDRY_EMAIL;
            secret/data/products/connectors/ci/sap SAP_CLOUDFOUNDRY_PASSWORD;

      # third, actual deployment
      - name: deploy ${{inputs.connector_version}} to BTP
        # download-artifact puts the file w/o subdir here
        env:
          CF_API: ${{ inputs.cf_api_endpoint }}
          CF_ORG: ${{ inputs.cf_org }}
          CF_SPACE: ${{ inputs.cf_space }}
          CF_USER: ${{ steps.vault-secrets.outputs.SAP_CLOUDFOUNDRY_EMAIL }}
          CF_PASSWORD: ${{ steps.vault-secrets.outputs.SAP_CLOUDFOUNDRY_PASSWORD }}
        run: |
          cf install-plugin multiapps -f
          cd odata-connector
          ls -al .
          cf login -a "$CF_API" -u "$CF_USER" -p "$CF_PASSWORD" -o "$CF_ORG" -s "$CF_SPACE"
          cf deploy ./ -f

      - name: dump app + MTA logs on failure
        if: failure()
        env:
          APP: ${{ inputs.deployment_name }}
        run: |
          set +e
          echo "=== cf target ==="
          cf target
          echo "=== cf apps ==="
          cf apps
          echo "=== cf app $APP ==="
          cf app "$APP"
          echo "=== cf events $APP ==="
          cf events "$APP"
          echo "=== cf logs $APP --recent ==="
          cf logs "$APP" --recent
          echo "=== cf mta-ops ==="
          cf mta-ops
          OP_ID=$(cf mta-ops | awk 'NR>1 && $2=="deploy" {print $1}' | tail -1)
          if [ -n "$OP_ID" ]; then
            echo "=== cf dmol -i $OP_ID ==="
            cf dmol -i "$OP_ID"
          fi
