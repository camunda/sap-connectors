# TEMPORARY smoke test - do not merge.
# Verifies the real GitHub OIDC -> GCP -> Artifact Registry push path for the
# RFC scanner image introduced in PR #197. It does NOT create a GitHub Release
# and does NOT touch any production release logic.
name: RFC scanner image GAR smoke test

on:
  push:
    branches:
      - test/3292-rfc-scanner-gar

permissions:
  contents: read
  id-token: write

jobs:
  scanner-image-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: set up jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: build project
        run: mvn clean package -DskipTests

      # Identical WAR-selection logic to .github/workflows/rfc-build-and-publish.yml
      - name: Stage RFC scanner image context
        run: |
          set -euo pipefail
          RFC_WAR=$(find rfc-connector/target -maxdepth 1 -name 'rfc-*.war' -print -quit)
          if [ -z "$RFC_WAR" ]; then
            echo "ERROR: No WAR file found in rfc-connector/target/" >&2
            exit 1
          fi
          echo "Selected WAR: $RFC_WAR"
          mkdir -p /tmp/rfc-scanner-context
          cp "$RFC_WAR" /tmp/rfc-scanner-context/sap-rfc-connector.war
          cp rfc-connector/Dockerfile.scanner /tmp/rfc-scanner-context/Dockerfile

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Login to InfoSec Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: sap-rfc-connector - build and push smoke-test scanner image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/rfc-scanner-context
          push: true
          tags: |
            europe-west1-docker.pkg.dev/team-infosec/camunda/sap-rfc-connector:pr-197-smoke
          platforms: linux/amd64
          provenance: false
