name: Release all artifacts
on:
  schedule:
    # nightly SNAPSHOT build of the default branch (main)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      patch-version:
        description: |
          The release patch version. Minor is specified by the branch.
          E.g. specify "5" to release version "8.6.5" if on branch "release/8.6".
          Must match the "-SNAPSHOT" version in pom.xml, e.g. "8.6.5-SNAPSHOT".
          Ignored on "main", which always publishes "SNAPSHOT".
        required: false

# one release per branch at a time: a second dispatch waits for the running one instead of racing it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name is main or has release/ prefix
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          PATCH_VERSION: ${{ github.event.inputs['patch-version'] }}
        run: |
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "Branch validation passed: $BRANCH_NAME (SNAPSHOT build)"
            exit 0
          fi
          if [[ ! "$BRANCH_NAME" =~ ^release/ ]]; then
            echo "Error: This workflow can only be run on 'main' or branches with 'release/' prefix."
            echo "Current branch: $BRANCH_NAME"
            exit 1
          fi
          if [[ -z "$PATCH_VERSION" ]]; then
            echo "Error: 'patch-version' input is required on release branches."
            exit 1
          fi
          echo "Branch validation passed: $BRANCH_NAME"

  build-final-version:
    needs: validate-branch
    runs-on: ubuntu-latest
    outputs:
      FINAL_VERSION: ${{ steps.final_version.outputs.FINAL_VERSION }}
      NEXT_SNAPSHOT_VERSION: ${{ steps.final_version.outputs.NEXT_SNAPSHOT_VERSION }}

    steps:
      - uses: actions/checkout@v7

      - name: set up jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: determine final version
        id: final_version
        env:
          PATCH_VERSION: ${{ github.event.inputs['patch-version'] }}
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "FINAL_VERSION=SNAPSHOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the branch carries the version to release as <major>.<minor>.<patch>-SNAPSHOT
          PROJECT_VERSION=$(mvn -B -N -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ ! "$PROJECT_VERSION" =~ ^([0-9]+\.[0-9]+)\.([0-9]+)-SNAPSHOT$ ]]; then
            echo "::error::pom.xml version '$PROJECT_VERSION' is not '<major>.<minor>.<patch>-SNAPSHOT'."
            exit 1
          fi
          MINOR_VERSION="${BASH_REMATCH[1]}"
          if [[ "$PATCH_VERSION" != "${BASH_REMATCH[2]}" ]]; then
            echo "::error::patch-version '$PATCH_VERSION' does not match pom.xml version '$PROJECT_VERSION'."
            exit 1
          fi
          FINAL_VERSION="${MINOR_VERSION}.${PATCH_VERSION}"
          NEXT_SNAPSHOT_VERSION="${MINOR_VERSION}.$((10#$PATCH_VERSION + 1))-SNAPSHOT"
          RELEASE_TAGS=$(git ls-remote --tags origin "refs/tags/odata-${FINAL_VERSION}" "refs/tags/rfc-${FINAL_VERSION}")
          if [[ -n "$RELEASE_TAGS" ]]; then
            echo "::error::${FINAL_VERSION} is already (at least partially) released: a release tag exists." \
              "To finish a release that failed partway, use \"Re-run failed jobs\" on its run;" \
              "otherwise merge the PR that advances pom.xml to ${NEXT_SNAPSHOT_VERSION} first."
            exit 1
          fi
          echo "FINAL_VERSION=${FINAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "NEXT_SNAPSHOT_VERSION=${NEXT_SNAPSHOT_VERSION}" >> "$GITHUB_OUTPUT"

  odata-release:
    needs: build-final-version
    uses: ./.github/workflows/odata-build-and-publish.yml
    secrets: inherit
    with:
      final_version: ${{ needs.build-final-version.outputs.FINAL_VERSION }}

  rfc-release:
    needs: build-final-version
    permissions:
      contents: write   # required by rfc-build-and-publish.yml to publish the GitHub release
      id-token: write   # required by rfc-build-and-publish.yml for OIDC auth against Google Artifact Registry
    uses:  ./.github/workflows/rfc-build-and-publish.yml
    secrets: inherit
    with:
      final_version: ${{ needs.build-final-version.outputs.FINAL_VERSION }}

  # Opens a version-only PR that advances the branch to the next patch -SNAPSHOT once both connectors are released.
  # The PR is not merged automatically.
  next-development-version:
    needs: [ build-final-version, odata-release, rfc-release ]
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions: {}   # pushes and opens the PR with the GitHub App token below, not with GITHUB_TOKEN
    steps:
      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: false
          secrets: |
            secret/data/github.com/organizations/camunda BACKPORT_GH_APP_ID;
            secret/data/github.com/organizations/camunda BACKPORT_GH_APP_KEY;

      # same GitHub App as backport-pr.yml: unlike GITHUB_TOKEN, its PRs trigger the required CI checks
      - name: Generate a GitHub token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.vault-secrets.outputs.BACKPORT_GH_APP_ID }}
          private-key: ${{ steps.vault-secrets.outputs.BACKPORT_GH_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: set up jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: open the next development version PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FINAL_VERSION: ${{ needs.build-final-version.outputs.FINAL_VERSION }}
          NEXT_SNAPSHOT_VERSION: ${{ needs.build-final-version.outputs.NEXT_SNAPSHOT_VERSION }}
        run: |
          PROJECT_VERSION=$(mvn -B -N -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$PROJECT_VERSION" == "$NEXT_SNAPSHOT_VERSION" ]]; then
            echo "${GITHUB_REF_NAME} is already on ${NEXT_SNAPSHOT_VERSION}."
            exit 0
          fi
          if [[ "$PROJECT_VERSION" != "${FINAL_VERSION}-SNAPSHOT" ]]; then
            echo "::error::${GITHUB_REF_NAME} is on ${PROJECT_VERSION}, expected ${FINAL_VERSION}-SNAPSHOT; advance it manually."
            exit 1
          fi
          VERSION_BRANCH="chore/next-version-${NEXT_SNAPSHOT_VERSION}"
          OPEN_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$VERSION_BRANCH" --state open --json url --jq '.[].url')
          if [[ -n "$OPEN_PR" ]]; then
            echo "The next development version PR is already open: ${OPEN_PR}"
            exit 0
          fi
          git switch -c "$VERSION_BRANCH"
          mvn -B -q versions:set -DnewVersion="$NEXT_SNAPSHOT_VERSION" -DgenerateBackupPoms=false
          CHANGED_FILES=$(git status --porcelain)
          if [[ "$CHANGED_FILES" != "$(printf ' M %s\n' odata-connector/pom.xml pom.xml rfc-connector/pom.xml)" ]]; then
            echo "::error::versions:set changed unexpected files:"$'\n'"${CHANGED_FILES}"
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -am "chore: prepare next development version ${NEXT_SNAPSHOT_VERSION}"
          git push --force origin "HEAD:refs/heads/${VERSION_BRANCH}"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$VERSION_BRANCH" \
            --title "chore: prepare next development version ${NEXT_SNAPSHOT_VERSION}" \
            --body "Advances \`${GITHUB_REF_NAME}\` to \`${NEXT_SNAPSHOT_VERSION}\` after the release of \`${FINAL_VERSION}\` in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Version-only change created by the release workflow; merge it once CI is green."
