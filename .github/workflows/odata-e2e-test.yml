name: odata-e2e-test

on:
  workflow_call:
    inputs:
      connector_version: # fex: 8.5.7 - 8.5 for Camunda release, 7 for connector version
        required: true
        type: string
      deployment_name:
        required: true
        type: string
      cf_api_endpoint:
        required: true
        type: string
      cf_org:
        required: true
        type: string
      cf_space:
        required: true
        type: string

jobs:
  build-and-publish-dev-container-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
        - name: Import Secrets
          id: secrets
          uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
          with:
            url: ${{ secrets.VAULT_ADDR }}
            method: jwt
            path: ${{ secrets.VAULT_JWT_PATH }}
            role: ${{ secrets.VAULT_JWT_ROLE }}
            jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
            exportEnv: false
            secrets: |
              secret/data/products/connectors/ci/harbor username | HARBOR_USERNAME;
              secret/data/products/connectors/ci/harbor password | HARBOR_PASSWORD;
 
        - name: Checkout repository
          uses: actions/checkout@v4
 
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4
 
        # Log in to GitHub Container Registry
        - name: Log in to hurbor
          uses: docker/login-action@v3
          with:
            registry: registry.camunda.cloud
            username: ${{ steps.secrets.outputs.HARBOR_USERNAME }}
            password: ${{ steps.secrets.outputs.HARBOR_PASSWORD }}
 
        # Build and push to your private GHCR repo
        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: registry.camunda.cloud/team-connectors/sap-odata-connector/${{ inputs.deployment_name.lowercase }}:latest


  deploy-to-btp:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/odata-reusable-deploy.yml
    with:
      connector_version: ${{ inputs.connector_version }}
      deployment_name: ${{ inputs.deployment_name }}
      cf_api_endpoint: ${{ inputs.cf_api_endpoint }}
      cf_org: ${{ inputs.cf_org }}
      cf_space: ${{ inputs.cf_space }}
    secrets: inherit

  e2e:
    needs: deploy-to-btp
    uses: ./.github/workflows/odata-reusable-e2e-test.yml
    with:
      java-version: '25'
      distribution: 'temurin'
      maven-options: ''

  undeploy:
    needs: [ e2e, deploy-to-btp ]
    if: always()
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/odata-reusable-undeploy.yml
    with:
      connector_version: ${{ inputs.connector_version }}
      deployment_name: ${{ inputs.deployment_name }}
      cf_api_endpoint: ${{ inputs.cf_api_endpoint }}
      cf_org: ${{ inputs.cf_org }}
      cf_space: ${{ inputs.cf_space }}
    secrets: inherit

  delete-dev-container-image-from-repository:
    runs-on: ubuntu-latest
    needs: build-and-publish-dev-container-image
    if: always()
    steps:
      - name: remove container dev image
        run: |
          true

