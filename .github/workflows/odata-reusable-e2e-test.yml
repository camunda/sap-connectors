name: odata-reusable-e2e-test

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      distribution:
        required: true
        type: string
      maven-options:
        required: true
        type: string
      cluster_id:
        required: true
        type: string
      region_id:
        required: true
        type: string
      base_domain:
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: set up jdk ${{ inputs.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
          cache: maven

      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_ID;
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_SECRET;

      # the client secret must not travel via job outputs (GitHub drops masked values), so create a client here
      - name: Create client for e2e test
        id: create_client
        run: node scripts/manage_cluster.js -c "$CLUSTER_ID" "${{ github.job }}"
        env:
          CLUSTER_ID: ${{ inputs.cluster_id }}
          BASE_HOSTNAME: ${{ inputs.base_domain }}
          CONSOLE_CLIENT_ID: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_ID }}
          CONSOLE_CLIENT_SECRET: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_SECRET }}

      # this runs w/ the deployed (!) connector
      # against c8 saas
      # and ecc
      - name: e2e tests (deployed connector, against c8 + ecc)
        working-directory: odata-connector
        env:
          e2e: true
          CLIENT_ID: ${{ steps.create_client.outputs.client-id }}
          CLIENT_SECRET: ${{ steps.create_client.outputs.client-secret }}
          CLUSTER_ID: ${{ inputs.cluster_id }}
          REGION_ID: ${{ inputs.region_id }}
          BASE_DOMAIN: ${{ inputs.base_domain }}
        run: |
          # by env var e2e, only the respective tests are run
          mvn ${{ inputs.maven-options }} test -Dtest=io.camunda.connector.sap.odata.E2eTest

