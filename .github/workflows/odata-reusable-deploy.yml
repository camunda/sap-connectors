name: odata-reusable-deploy

on:
  workflow_call:
    inputs:
      connector_version: # fex: 8.5.7 - 8.5 for Camunda release, 7 for connector version
        required: true
        type: string
      deployment_name:
        required: true
        type: string
      cluster_id:
        required: true
        type: string
      region_id:
        required: true
        type: string
      base_domain:
        required: true
        type: string
      cf_api_endpoint:
        required: true
        type: string
      cf_org:
        required: true
        type: string
      cf_space:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # runs on the runner (not in the cf container) as node is needed for the helper scripts
      - name: install cf cli
        run: |
          set -euo pipefail
          # apt-key was removed from ubuntu-latest runners; use a signed-by keyring instead
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/cli.cloudfoundry.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/cli.cloudfoundry.org.gpg] https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli
          cf install-plugin multiapps -f

      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_ID;
            secret/data/products/connectors/ci/sap CONSOLE_CLIENT_SECRET;
            secret/data/products/connectors/ci/sap SAP_CLOUDFOUNDRY_EMAIL;
            secret/data/products/connectors/ci/sap SAP_CLOUDFOUNDRY_PASSWORD;
            secret/data/products/connectors/ci/harbor username | HARBOR_USERNAME;
            secret/data/products/connectors/ci/harbor password | HARBOR_PASSWORD;

      # the client secret must not travel via job outputs or artifacts, so create the client here
      - name: Create client for the deployed connector
        id: create_client
        run: node scripts/manage_cluster.js -c "$CLUSTER_ID" "${{ github.job }}"
        env:
          CLUSTER_ID: ${{ inputs.cluster_id }}
          BASE_HOSTNAME: ${{ inputs.base_domain }}
          CONSOLE_CLIENT_ID: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_ID }}
          CONSOLE_CLIENT_SECRET: ${{ steps.vault-secrets.outputs.CONSOLE_CLIENT_SECRET }}

      # sensitive values are passed to cf deploy via __MTA___ env vars and never written to the descriptor
      - name: deploy ${{inputs.connector_version}} to BTP
        env:
          CF_API: ${{ inputs.cf_api_endpoint }}
          CF_ORG: ${{ inputs.cf_org }}
          CF_SPACE: ${{ inputs.cf_space }}
          CF_USER: ${{ steps.vault-secrets.outputs.SAP_CLOUDFOUNDRY_EMAIL }}
          CF_PASSWORD: ${{ steps.vault-secrets.outputs.SAP_CLOUDFOUNDRY_PASSWORD }}
          __MTA___docker-user: ${{ steps.vault-secrets.outputs.HARBOR_USERNAME }}
          __MTA___docker-password: ${{ steps.vault-secrets.outputs.HARBOR_PASSWORD }}
          # resolved by `cf deploy` into the ${...} parameters of mtad.yaml.dev
          __MTA___region-id: ${{ inputs.region_id }}
          __MTA___cluster-id: ${{ inputs.cluster_id }}
          __MTA___base-domain: ${{ inputs.base_domain }}
          __MTA___client-id: ${{ steps.create_client.outputs.client-id }}
          __MTA___client-secret: ${{ steps.create_client.outputs.client-secret }}
          DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
          # Static 8.10.3 used until alternative container image storage configured for development "$VERSION" testing
          APP_VERSION: "8.10.3"
        run: |
          set -euo pipefail
          cd odata-connector
          # remove the filled-in descriptor, whatever the deploy outcome
          trap 'rm -f mtad.yaml' EXIT
          cp mtad.yaml.dev mtad.yaml
          # only the structural placeholders (MTA ID, names, image path) are filled in here
          ../scripts/replace_mtad_placeholders.js mtad.yaml "$APP_VERSION" "$DEPLOYMENT_NAME"
          cf login -a "$CF_API" -u "$CF_USER" -p "$CF_PASSWORD" -o "$CF_ORG" -s "$CF_SPACE"
          cf deploy ./ -f --require-secure-parameters --disposable-user-provided-service

      - name: dump app + MTA logs on failure
        if: failure()
        env:
          APP: ${{ inputs.deployment_name }}
        run: |
          set +e
          echo "=== cf target ==="
          cf target
          echo "=== cf apps ==="
          cf apps
          echo "=== cf app $APP ==="
          cf app "$APP"
          echo "=== cf events $APP ==="
          cf events "$APP"
          echo "=== cf logs $APP --recent ==="
          cf logs "$APP" --recent
          echo "=== cf mta-ops ==="
          cf mta-ops
          OP_ID=$(cf mta-ops | awk 'NR>1 && $2=="deploy" {print $1}' | tail -1)
          if [ -n "$OP_ID" ]; then
            echo "=== cf dmol -i $OP_ID ==="
            cf dmol -i "$OP_ID"
          fi
