name: rfc-reusable-build-and-test

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      distribution:
        required: true
        type: string
      maven-options:
        required: true
        type: string
      client_id:
        required: true
        type: string
      client_secret:
        required: true
        type: string
      cluster_id:
        required: true
        type: string
      region_id:
        required: true
        type: string
      base_domain:
        required: true
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: set up jdk ${{ inputs.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
          cache: maven

      # this runs w/ the deployed (!) connector
      # against c8 saas
      # and ecc
      - name: e2e tests (deployed connector, against c8 + ecc)
        env:
          e2e: true
          CLIENT_ID: ${{ inputs.client_id }}
          CLIENT_SECRET: ${{ inputs.client_secret }}
          CLUSTER_ID: ${{ inputs.cluster_id }}
          REGION_ID: ${{ inputs.region_id }}
          BASE_DOMAIN: ${{ inputs.base_domain }}
        run: |
          # by env var e2e, only the respective tests are run
          mvn -pl rfc-connector ${{ inputs.maven-options }} test
