name: odata-reusable-undeploy

on:
  workflow_call:
    inputs:
      connector_version: # fex: 8.5.7 - 8.5 for Camunda release, 7 for connector version
        required: true
        type: string
      deployment_name: # unique deployment name (e.g., sap-odata-connector-8.5.7-main-123456)
        required: true
        type: string
      cf_api_endpoint:
        required: true
        type: string
      cf_org:
        required: true
        type: string
      cf_space:
        required: true
        type: string

jobs:
  undeploy-btp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    container:
      image: cloudfoundry/cli:latest
    steps:
      - name: Import Secrets
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          secrets: |
            secret/data/products/connectors/ci/sap SAP_CLOUDFOUNDRY_EMAIL;
            secret/data/products/connectors/ci/sap SAP_CLOUDFOUNDRY_PASSWORD;
      - name: undeploy ${{inputs.connector_version}} from BTP
        env:
          APP: ${{ inputs.deployment_name }}
          CF_API: ${{ inputs.cf_api_endpoint }}
          CF_ORG: ${{ inputs.cf_org }}
          CF_SPACE: ${{ inputs.cf_space }}
          CF_USER: ${{ steps.vault-secrets.outputs.SAP_CLOUDFOUNDRY_EMAIL }}
          CF_PASSWORD: ${{ steps.vault-secrets.outputs.SAP_CLOUDFOUNDRY_PASSWORD }}
        run: |
          cf install-plugin multiapps -f
          ls -al .
          cf login -a "$CF_API" -u "$CF_USER" -p "$CF_PASSWORD" -o "$CF_ORG" -s "$CF_SPACE"
          # MTA ID as defined in odata-connector/mtad.yaml.example (ID: odata-<deployment-name>);
          # undeploy removes the app and, with --delete-services, the dest-/conn- services
          if ! cf undeploy "odata-$APP" -f --delete-services --delete-service-keys; then
            echo "MTA undeploy failed (deployment may not have been registered), falling back to manual cleanup"
            cf delete "$APP" -f -r || true
            cf delete-service "dest-$APP" -f || true
            cf delete-service "conn-$APP" -f || true
            false
          fi
